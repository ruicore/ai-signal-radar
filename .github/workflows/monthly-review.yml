name: Monthly Review

on:
  schedule:
    - cron: "20 3 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to generate, formatted YYYY-MM. Defaults to the previous UTC month."
        required: false
        type: string
      track:
        description: "Track to generate, or all."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - systems
          - creation

permissions:
  contents: write

jobs:
  monthly-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate reviewed content
        run: uv run python scripts/validate_content.py

      - name: Resolve month
        id: month
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$REQUESTED_MONTH" ]; then
            echo "month=$REQUESTED_MONTH" >> "$GITHUB_OUTPUT"
          else
            echo "month=$(uv run python -c 'from scripts.generate_monthly_review import previous_month; print(previous_month())')" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate monthly reviews
        env:
          REQUESTED_TRACK: ${{ inputs.track }}
        run: |
          tracks="systems creation"
          if [ -n "$REQUESTED_TRACK" ] && [ "$REQUESTED_TRACK" != "all" ]; then
            tracks="$REQUESTED_TRACK"
          fi
          for track in $tracks; do
            uv run python scripts/generate_monthly_review.py "${{ steps.month.outputs.month }}" --track "$track"
          done

      - name: Commit monthly review if changed
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          if [ -z "$(git status --porcelain -- reports/monthly)" ]; then
            echo "No monthly review changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/monthly
          git commit -m "Generate monthly radar review ${MONTH}"
          git push
