name: Monthly Review

on:
  schedule:
    - cron: "20 3 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to generate, formatted YYYY-MM. Defaults to the previous UTC month."
        required: false
        type: string

permissions:
  contents: write

jobs:
  monthly-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate reviewed content
        run: uv run python scripts/validate_content.py

      - name: Resolve month
        id: month
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$REQUESTED_MONTH" ]; then
            echo "month=$REQUESTED_MONTH" >> "$GITHUB_OUTPUT"
          else
            echo "month=$(uv run python -c 'from scripts.generate_monthly_review import previous_month; print(previous_month())')" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate monthly review
        run: uv run python scripts/generate_monthly_review.py "${{ steps.month.outputs.month }}"

      - name: Commit monthly review if changed
        env:
          MONTH: ${{ steps.month.outputs.month }}
        run: |
          report_path="reports/monthly/${MONTH}.md"
          if [ -z "$(git status --porcelain -- "$report_path")" ]; then
            echo "No monthly review changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report_path"
          git commit -m "Generate monthly radar review ${MONTH}"
          git push
